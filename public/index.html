<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snub Browser</title>
    <style>
        :root {
            --bg-window: #090c10;
            --toolbar-bg: #11151c;
            --tab-bg-active: #181d26;
            --tab-text-active: #ffffff;
            --tab-text-inactive: #8b949e;
            --border-color: #21262d;
            --input-bg: #0d1117;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
            --accent-blue: #3b82f6;
            --hover-bg: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-window);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .browser-chrome {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .top-row {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 8px;
            gap: 8px;
        }

        .app-brand {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            padding: 0 8px;
        }

        .tabs-container {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            height: 100%;
            padding-top: 6px;
        }

        .tab {
            display: flex;
            align-items: center;
            background-color: transparent;
            color: var(--tab-text-inactive);
            padding: 0 12px;
            height: 34px;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            gap: 8px;
            min-width: 130px;
            max-width: 180px;
            cursor: pointer;
        }

        .tab.active {
            background-color: var(--tab-bg-active);
            color: var(--tab-text-active);
            border-top: 2px solid var(--accent-blue);
        }

        .tab-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-close {
            font-size: 14px;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-close:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .new-tab-btn {
            background: transparent;
            border: none;
            color: var(--tab-text-inactive);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .new-tab-btn:hover {
            background-color: var(--hover-bg);
            color: var(--text-main);
        }

        .nav-row {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 10px;
            gap: 6px;
            background-color: var(--tab-bg-active);
            border-top: 1px solid var(--border-color);
        }

        .url-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0 12px;
            height: 30px;
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .browser-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px 20px;
            align-items: center;
        }

        .view-pane {
            display: none;
            width: 100%;
            max-width: 700px;
            flex-direction: column;
            gap: 20px;
        }

        .view-pane.active {
            display: flex;
        }

        .dashboard {
            align-items: center;
            margin-top: 40px;
        }

        .dashboard-logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quick-search {
            width: 100%;
            display: flex;
            background-color: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            gap: 12px;
            align-items: center;
        }

        .quick-search input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .quick-search button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .results-header {
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-url {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-title {
            font-size: 16px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="browser-chrome">
        <div class="top-row">
            <div class="app-brand">Snub</div>
            <div class="tabs-container" id="tabsContainer"></div>
            <button class="new-tab-btn" id="newTabBtn" title="New Tab">+</button>
        </div>
        <div class="nav-row">
            <div class="url-bar-container">
                <input type="text" class="url-input" id="urlInput" readonly>
            </div>
        </div>
    </div>

    <div class="browser-viewport" id="viewport"></div>

    <script>
        let tabs = [];
        let activeTabId = null;
        let tabIdCounter = 0;

        const tabsContainer = document.getElementById('tabsContainer');
        const viewport = document.getElementById('viewport');
        const urlInput = document.getElementById('urlInput');

        function createTab(initialUrl = 'snub://home') {
            const tabId = ++tabIdCounter;
            const tabData = {
                id: tabId,
                title: 'New Tab',
                url: initialUrl
            };

            tabs.push(tabData);

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `tab-btn-${tabId}`;
            tabEl.innerHTML = `
                <span class="tab-title" id="tab-title-${tabId}">New Tab</span>
                <span class="tab-close" onclick="closeTab(event, ${tabId})">&times;</span>
            `;
            tabEl.onclick = () => switchTab(tabId);
            tabsContainer.appendChild(tabEl);

            const paneEl = document.createElement('div');
            paneEl.className = 'view-pane';
            paneEl.id = `pane-${tabId}`;
            paneEl.innerHTML = `
                <div class="dashboard" style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%;">
                    <h1 class="dashboard-logo">Snub</h1>
                    <div class="quick-search">
                        <input type="text" id="search-input-${tabId}" placeholder="Search the web instantly...">
                        <button onclick="triggerSearch(${tabId})">Search</button>
                    </div>
                </div>
                <div class="results-container" id="results-container-${tabId}" style="display: none; flex-direction: column; gap: 20px;">
                    <div class="results-header" id="results-stats-${tabId}"></div>
                    <div id="results-list-${tabId}" style="display: flex; flex-direction: column; gap: 20px;"></div>
                </div>
            `;
            viewport.appendChild(paneEl);

            setTimeout(() => {
                const inputEl = document.getElementById(`search-input-${tabId}`);
                if (inputEl) {
                    inputEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') triggerSearch(tabId);
                    });
                }
            }, 50);

            switchTab(tabId);
        }

        function switchTab(tabId) {
            activeTabId = tabId;

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

            const tabBtn = document.getElementById(`tab-btn-${tabId}`);
            const paneEl = document.getElementById(`pane-${tabId}`);

            if (tabBtn) tabBtn.classList.add('active');
            if (paneEl) paneEl.classList.add('active');

            const currentTab = tabs.find(t => t.id === tabId);
            if (currentTab) {
                urlInput.value = currentTab.url;
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();

            if (tabs.length === 1) return;

            const tabIndex = tabs.findIndex(t => t.id === tabId);
            if (tabIndex === -1) return;

            tabs.splice(tabIndex, 1);

            document.getElementById(`tab-btn-${tabId}`)?.remove();
            document.getElementById(`pane-${tabId}`)?.remove();

            if (activeTabId === tabId) {
                const nextTab = tabs[Math.max(0, tabIndex - 1)];
                switchTab(nextTab.id);
            }
        }

        async function triggerSearch(tabId) {
            const inputEl = document.getElementById(`search-input-${tabId}`);
            const query = inputEl ? inputEl.value.trim() : '';
            if (!query) return;

            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            tab.query = query;
            tab.url = `snub://search?q=${encodeURIComponent(query)}`;
            tab.title = query;
            document.getElementById(`tab-title-${tabId}`).textContent = query;

            if (activeTabId === tabId) {
                urlInput.value = tab.url;
            }

            const pane = document.getElementById(`pane-${tabId}`);
            const dashboardEl = pane.querySelector('.dashboard');
            const resultsContainer = pane.querySelector(`#results-container-${tabId}`);
            const resultsStats = pane.querySelector(`#results-stats-${tabId}`);
            const resultsList = pane.querySelector(`#results-list-${tabId}`);

            dashboardEl.style.display = 'none';
            resultsContainer.style.display = 'flex';
            resultsStats.textContent = 'Fetching live web results...';
            resultsList.innerHTML = '';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsStats.textContent = `About ${data.count} live results (${data.timeMs}ms)`;

                if (data.results.length === 0) {
                    resultsList.innerHTML = `<div class="result-snippet">No results found for your query. Try different keywords.</div>`;
                    return;
                }

                data.results.forEach(res => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `
                        <span class="result-url">${res.url}</span>
                        <a class="result-title" href="${res.url}" target="_blank">${res.title}</a>
                        <div class="result-snippet">${res.snippet}</div>
                    `;
                    resultsList.appendChild(item);
                });
            } catch (err) {
                resultsStats.textContent = 'Error connecting to live search engine.';
            }
        }

        document.getElementById('newTabBtn').addEventListener('click', () => createTab());

        createTab();
    </script>
</body>
</html>
