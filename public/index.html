<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snub Engine & Web Spider</title>
    <style>
        :root {
            --bg-window: #0d1117;
            --toolbar-bg: #161b22;
            --tab-bg-active: #21262d;
            --tab-text-active: #ffffff;
            --tab-text-inactive: #8b949e;
            --border-color: #30363d;
            --input-bg: #010409;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --card-bg: #161b22;
            --hover-bg: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-window); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .browser-chrome { background-color: var(--toolbar-bg); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .top-row { display: flex; align-items: center; height: 40px; padding: 0 12px; gap: 8px; }
        .app-brand { font-weight: 800; font-size: 15px; background: linear-gradient(135deg, #58a6ff, #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs-container { display: flex; align-items: center; gap: 4px; flex: 1; margin-left: 12px; }
        .tab { display: flex; align-items: center; background-color: transparent; color: var(--tab-text-inactive); padding: 0 16px; height: 34px; border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer; user-select: none; }
        .tab.active { background-color: var(--tab-bg-active); color: var(--tab-text-active); border-top: 2px solid var(--accent-blue); }

        .browser-viewport { flex: 1; display: flex; flex-direction: column; overflow-y: auto; align-items: center; position: relative; }
        .view-pane { display: none; width: 100%; max-width: 780px; padding: 40px 20px; flex-direction: column; gap: 24px; }
        .view-pane.active { display: flex; }

        /* Search Interface */
        .logo-section { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 40px; }
        .dashboard-logo { font-size: 64px; font-weight: 900; background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1.5px; }
        .tagline { font-size: 13px; color: var(--text-muted); }

        .search-box-wrapper { position: relative; width: 100%; }
        .search-input-group { display: flex; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 8px 16px; gap: 12px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .search-input-group:focus-within { border-color: var(--accent-blue); }
        .search-input-group input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; padding: 6px 0; }
        .search-input-group button { background-color: var(--accent-blue); color: #000; font-weight: 600; border: none; padding: 8px 20px; border-radius: 16px; cursor: pointer; }

        .suggestions-dropdown { position: absolute; top: 105%; left: 0; right: 0; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 100; display: none; overflow: hidden; }
        .suggestion-item { padding: 12px 20px; font-size: 14px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .suggestion-item:hover { background-color: var(--hover-bg); color: var(--accent-blue); }

        /* Results Display */
        .results-header { font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .result-item { display: flex; flex-direction: column; gap: 4px; }
        .result-meta { display: flex; align-items: center; gap: 8px; }
        .result-favicon { width: 16px; height: 16px; border-radius: 3px; }
        .result-domain { font-size: 12px; color: var(--text-muted); }
        .result-title { font-size: 18px; color: var(--accent-blue); text-decoration: none; font-weight: 500; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        .result-snippet b { color: var(--text-main); font-weight: 700; background-color: rgba(88, 166, 255, 0.15); padding: 0 2px; border-radius: 2px; }

        /* Admin / Crawler Dashboard */
        .admin-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .admin-card h2 { font-size: 18px; color: var(--text-main); }
        .crawl-form { display: flex; gap: 10px; }
        .crawl-form input { flex: 1; background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 6px; font-size: 14px; outline: none; }
        .crawl-form button { background-color: var(--accent-green); color: #000; font-weight: 600; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--accent-blue); }
        .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .log-terminal { background-color: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; color: #7ee787; display: flex; flex-direction: column; gap: 4px; }
    </style>
</head>
<body>

    <div class="browser-chrome">
        <div class="top-row">
            <div class="app-brand">Snub OS</div>
            <div class="tabs-container">
                <div class="tab active" id="tab-search-btn" onclick="switchTab('search')">🔍 Web Search</div>
                <div class="tab" id="tab-spider-btn" onclick="switchTab('spider')">🕷️ Spider & Control Panel</div>
            </div>
        </div>
    </div>

    <div class="browser-viewport">
        <!-- Pane 1: Search Engine -->
        <div class="view-pane active" id="pane-search">
            <div class="logo-section">
                <h1 class="dashboard-logo">Snub</h1>
                <p class="tagline">Independent SQLite FTS5 Full-Text Search Engine</p>
            </div>

            <div class="search-box-wrapper">
                <div class="search-input-group">
                    <input type="text" id="searchInput" placeholder="Search your custom indexed web..." autocomplete="off">
                    <button onclick="runSearch()">Search</button>
                </div>
                <div class="suggestions-dropdown" id="suggestions"></div>
            </div>

            <div class="results-header" id="resultsStats" style="display: none;"></div>
            <div id="resultsList" style="display: flex; flex-direction: column; gap: 24px;"></div>
        </div>

        <!-- Pane 2: Spider Control Panel -->
        <div class="view-pane" id="pane-spider">
            <div class="admin-card">
                <h2>Web Crawler Manager</h2>
                <p style="font-size: 13px; color: var(--text-muted);">Seed a starting URL to crawl, extract text, and build your search index automatically.</p>
                
                <div class="crawl-form">
                    <input type="url" id="seedUrl" placeholder="https://en.wikipedia.org/wiki/Search_engine" required>
                    <button onclick="startCrawl()">Crawl & Index</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="statIndexed">0</div>
                        <div class="stat-lbl">Indexed Pages</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="statQueue">0</div>
                        <div class="stat-lbl">Queued Links</div>
                    </div>
                </div>

                <h2>Crawler Live Output</h2>
                <div class="log-terminal" id="logTerminal">Initializing spider interface...</div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

            if (tab === 'search') {
                document.getElementById('tab-search-btn').classList.add('active');
                document.getElementById('pane-search').classList.add('active');
            } else {
                document.getElementById('tab-spider-btn').classList.add('active');
                document.getElementById('pane-spider').classList.add('active');
            }
        }

        // Search Engine Functionality
        const searchInput = document.getElementById('searchInput');
        const suggestionsDropdown = document.getElementById('suggestions');

        let suggestTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(suggestTimer);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                suggestionsDropdown.style.display = 'none';
                return;
            }

            suggestTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/suggest?q=${encodeURIComponent(query)}`);
                    const suggestions = await res.json();
                    if (suggestions.length === 0) {
                        suggestionsDropdown.style.display = 'none';
                        return;
                    }

                    suggestionsDropdown.innerHTML = suggestions.map(s => `
                        <div class="suggestion-item" onclick="applySuggestion('${s.replace(/'/g, "\\'")}')">
                            🔍 ${s}
                        </div>
                    `).join('');
                    suggestionsDropdown.style.display = 'block';
                } catch (e) { suggestionsDropdown.style.display = 'none'; }
            }, 150);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                suggestionsDropdown.style.display = 'none';
                runSearch();
            }
        });

        function applySuggestion(text) {
            searchInput.value = text;
            suggestionsDropdown.style.display = 'none';
            runSearch();
        }

        async function runSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const statsEl = document.getElementById('resultsStats');
            const listEl = document.getElementById('resultsList');

            statsEl.style.display = 'block';
            statsEl.textContent = 'Searching index...';
            listEl.innerHTML = '';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                statsEl.textContent = `Found ${data.count} results (${data.timeMs} ms) for "${query}"`;

                if (data.results.length === 0) {
                    listEl.innerHTML = `<div class="result-snippet">No pages matched your search query in the local index. Switch to the <b>Spider Tab</b> to crawl websites!</div>`;
                    return;
                }

                data.results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `
                        <div class="result-meta">
                            ${item.favicon ? `<img class="result-favicon" src="${item.favicon}" onerror="this.style.display='none'">` : ''}
                            <span class="result-domain">${item.domain}</span>
                        </div>
                        <a class="result-title" href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
                        <div class="result-snippet">${item.snippet}</div>
                    `;
                    listEl.appendChild(div);
                });
            } catch (err) {
                statsEl.textContent = 'Search failed.';
            }
        }

        // Spider & Admin Functionality
        async function startCrawl() {
            const seedUrl = document.getElementById('seedUrl').value.trim();
            if (!seedUrl) return alert('Please enter a valid HTTP/HTTPS URL');

            try {
                await fetch('/api/crawl/seed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: seedUrl, maxPages: 20 })
                });
                alert('Crawler dispatched! Watch output terminal.');
            } catch (e) {
                alert('Failed to dispatch crawler');
            }
        }

        async function updateCrawlStatus() {
            try {
                const res = await fetch('/api/crawl/status');
                const data = await res.json();

                document.getElementById('statIndexed').textContent = data.indexCount;
                document.getElementById('statQueue').textContent = data.queueCount;

                const terminal = document.getElementById('logTerminal');
                terminal.innerHTML = data.logs.map(log => `<div>${log}</div>`).join('');
                terminal.scrollTop = terminal.scrollHeight;
            } catch (e) {}
        }

        setInterval(updateCrawlStatus, 2000);
        updateCrawlStatus();
    </script>
</body>
</html>
