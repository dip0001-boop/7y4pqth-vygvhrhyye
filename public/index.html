<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snub Browser & Search Engine</title>
    <style>
        :root {
            --bg-window: #090c10;
            --toolbar-bg: #11151c;
            --tab-bg-active: #181d26;
            --tab-text-active: #ffffff;
            --tab-text-inactive: #8b949e;
            --border-color: #21262d;
            --input-bg: #0d1117;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
            --accent-blue: #3b82f6;
            --hover-bg: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-window);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .browser-chrome {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .top-row {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 8px;
            gap: 8px;
        }

        .app-brand {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            padding: 0 8px;
        }

        .nav-row {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 10px;
            gap: 6px;
            background-color: var(--tab-bg-active);
            border-top: 1px solid var(--border-color);
        }

        .url-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 0 12px;
            height: 30px;
        }

        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .browser-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px 20px;
            align-items: center;
        }

        .dashboard {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 60px;
        }

        .dashboard-logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quick-search {
            width: 100%;
            display: flex;
            background-color: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            gap: 12px;
            align-items: center;
        }

        .quick-search input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .quick-search button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-results-container {
            max-width: 700px;
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
            align-self: flex-start;
            margin: 0 auto;
        }

        .results-header {
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-url {
            font-size: 12px;
            color: var(--text-muted);
        }

        .result-title {
            font-size: 16px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="browser-chrome">
        <div class="top-row">
            <div class="app-brand">Snub Engine</div>
        </div>
        <div class="nav-row">
            <div class="url-bar-container">
                <input type="text" class="url-input" id="urlInput" value="snub://home">
            </div>
        </div>
    </div>

    <div class="browser-viewport" id="viewport">
        <div class="dashboard" id="dashboardView">
            <h1 class="dashboard-logo">Snub</h1>
            <div class="quick-search">
                <input type="text" id="searchInput" placeholder="Search indexed web documents...">
                <button id="searchBtn">Search</button>
            </div>
        </div>

        <div class="search-results-container" id="resultsView">
            <div class="results-header" id="resultsStats"></div>
            <div id="resultsList" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>

    <script>
        const dashboardView = document.getElementById('dashboardView');
        const resultsView = document.getElementById('resultsView');
        const searchInput = document.getElementById('searchInput');
        const urlInput = document.getElementById('urlInput');
        const resultsList = document.getElementById('resultsList');
        const resultsStats = document.getElementById('resultsStats');

        async function executeSearch(query) {
            if (!query.trim()) return;
            
            dashboardView.style.display = 'none';
            resultsView.style.display = 'flex';
            urlInput.value = `snub://search?q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsStats.textContent = `Found ${data.count} results in ${data.timeMs}ms`;
                resultsList.innerHTML = '';

                if (data.results.length === 0) {
                    resultsList.innerHTML = `<div class="result-snippet">No indexed documents matched your query.</div>`;
                    return;
                }

                data.results.forEach(res => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `
                        <span class="result-url">${res.url}</span>
                        <a class="result-title" href="${res.url}" target="_blank">${res.title}</a>
                        <div class="result-snippet">${res.snippet}</div>
                    `;
                    resultsList.appendChild(item);
                });
            } catch (err) {
                resultsStats.textContent = 'Error executing search query.';
            }
        }

        document.getElementById('searchBtn').addEventListener('click', () => executeSearch(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeSearch(searchInput.value);
        });
    </script>
</body>
</html>
